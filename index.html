<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberSaq Dashboard</title>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #f5f5f0;
            --card-bg: #ffffff;
            --dark-card: #1e1e1e;
            --border-color: #000000;
            --primary-yellow: #ffde59;
            --accent-green: #6bc97f;
            --accent-red: #ff6b6b;
            --accent-blue: #4d82f3;
        }

        body {
            font-family: 'Courier New', Courier, monospace, sans-serif;
            background-color: var(--bg-color);
            margin: 20px;
            color: #000;
        }

        .top-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            align-items: center;
            flex-wrap: wrap;
        }

        .lang-switch {
            background-color: #fff;
            border: 3px solid var(--border-color);
            box-shadow: 3px 3px 0 var(--border-color);
            display: flex;
            padding: 2px;
        }

        .lang-btn {
            border: none;
            background: transparent;
            padding: 6px 14px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            font-family: inherit;
        }

        .lang-btn.active {
            background-color: var(--primary-yellow);
            border: 2px solid var(--border-color);
        }

        .stat-badge {
            background-color: #fff;
            border: 3px solid var(--border-color);
            box-shadow: 3px 3px 0 var(--border-color);
            padding: 8px 16px;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stat-badge span.highlight {
            color: var(--accent-red);
        }

        .shop-btn {
            background-color: #fff;
            border: 3px solid var(--border-color);
            box-shadow: 3px 3px 0 var(--border-color);
            padding: 8px 16px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            font-family: inherit;
        }

        /* Исправленная сетка на весь экран */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            gap: 20px;
            width: 100%;
            box-sizing: border-box;
        }

        .card {
            background: var(--card-bg);
            border: 3px solid var(--border-color);
            box-shadow: 4px 4px 0 var(--border-color);
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .external-link {
            background: var(--primary-yellow);
            border: 2px solid var(--border-color);
            padding: 2px 8px;
            font-size: 11px;
            text-decoration: none;
            color: #000;
            font-weight: bold;
        }

        .card.dark {
            background-color: var(--dark-card);
            color: #fff;
        }

        .card.dark .card-title {
            color: var(--primary-yellow);
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
        }

        .card.dark p {
            font-size: 13px;
            color: #ccc;
            line-height: 1.4;
            margin-bottom: 15px;
        }

        .cyber-btn {
            display: block;
            width: 100%;
            background: transparent;
            border: 2px solid #555;
            color: #fff;
            padding: 10px;
            text-align: center;
            text-decoration: none;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 10px;
            box-sizing: border-box;
            transition: 0.2s;
        }

        .cyber-btn:hover {
            border-color: var(--primary-yellow);
            color: var(--primary-yellow);
        }

        .chart-container {
            position: relative;
            width: 100%;
            height: 220px;
        }

        /* ИИ-Кейсы */
        .case-box {
            background: #fff;
            border: 2px dashed var(--border-color);
            padding: 15px;
            font-size: 14px;
            margin-bottom: 15px;
            min-height: 70px;
            line-height: 1.4;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }

        .opt-btn {
            background: #fff;
            border: 2px solid var(--border-color);
            padding: 10px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            box-shadow: 2px 2px 0 var(--border-color);
            font-family: inherit;
        }

        .opt-btn:hover {
            background: var(--primary-yellow);
        }

        .feedback {
            font-size: 13px;
            font-weight: bold;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="lang-switch">
            <button class="lang-btn" onclick="setLanguage('kz', this)">KZ</button>
            <button class="lang-btn active" onclick="setLanguage('ru', this)">RU</button>
            <button class="lang-btn" onclick="setLanguage('en', this)">EN</button>
        </div>
        <div class="stat-badge">
            <span data-i18n="rating">РЕЙТИНГ:</span> 
            <span class="highlight" id="xpDisplay">3950 XP</span>
        </div>
        <button class="shop-btn" data-i18n="shop">🛒 МАГАЗИН</button>
    </div>

    <div class="dashboard-grid">
        
        <!-- Карточка 1: Бесконечные ИИ-кейсы -->
        <div class="card">
            <div>
                <div class="card-header">
                    <span>🤖 <span data-i18n="ai_case_title">AI СИМУЛЯТОР КЕЙСОВ</span></span>
                </div>
                <div class="case-box" id="caseText">Загрузка кейса...</div>
            </div>
            <div>
                <div class="options-grid">
                    <button class="opt-btn" onclick="checkAnswer('phishing')" data-i18n="chart_phishing">Фишинг</button>
                    <button class="opt-btn" onclick="checkAnswer('deepfake')" data-i18n="chart_deepfake">Дипфейк</button>
                    <button class="opt-btn" onclick="checkAnswer('fake')" data-i18n="chart_fake">Фейк</button>
                    <button class="opt-btn" onclick="checkAnswer('official')" data-i18n="chart_official">Официально</button>
                </div>
                <div class="feedback" id="feedbackText"></div>
            </div>
        </div>

        <!-- Карточка 2: Карта киберугроз -->
        <div class="card">
            <div class="card-header">
                <span>📊 <span data-i18n="threats_title">КАРТА КИБЕРУГРОЗ РК</span></span>
                <a href="https://cert.gov.kz" target="_blank" class="external-link">KZ-CERT ↗</a>
            </div>
            <div class="chart-container">
                <canvas id="threatsChart"></canvas>
            </div>
        </div>

        <!-- Карточка 3: Точность анализа -->
        <div class="card">
            <div class="card-header">
                <span>🎯 <span data-i18n="accuracy_title">ВАША ТОЧНОСТЬ АНАЛИЗА</span></span>
            </div>
            <div class="chart-container">
                <canvas id="accuracyChart"></canvas>
            </div>
        </div>

        <!-- Карточка 4: Киберпол и EGOV -->
        <div class="card dark">
            <div>
                <div class="card-title">
                    📢 <span data-i18n="cyberpol_title">КИБЕРПОЛ РК & EGOV</span>
                </div>
                <p data-i18n="cyberpol_desc">
                    Подозрительный сайт или сообщение? Проверьте ресурсы через официальные базы данных:
                </p>
            </div>
            <div>
                <a href="https://cert.gov.kz" target="_blank" class="cyber-btn">
                    🛡️ <span data-i18n="btn_cert">KZ-CERT Служба компьютерной безопасности</span>
                </a>
                <a href="https://egov.kz" target="_blank" class="cyber-btn">
                    🏛️ <span data-i18n="btn_egov">eGov.kz Официальный портал</span>
                </a>
            </div>
        </div>

    </div>

    <script>
        const translations = {
            kz: {
                rating: "РЕЙТИНГ:",
                shop: "🛒 ДҮКЕН",
                ai_case_title: "AI СИМУЛЯТОР КЕЙСТЕРІ",
                threats_title: "ҚР КИБЕРҚАУІПТЕР КАРТАСЫ",
                accuracy_title: "ТАЛДАУ ДӘЛДІГІҢІЗ",
                cyberpol_title: "КИБЕРПОЛ ҚР & EGOV",
                cyberpol_desc: "Күдікті сайт немесе хабарлама ма? Ресурстарды ресми базалар арқылы тексеріңіз:",
                btn_cert: "KZ-CERT Компьютерлік қауіпсіздік қызметі",
                btn_egov: "eGov.kz Ресми порталы",
                chart_phishing: "Фишинг",
                chart_deepfake: "Дипфейктер",
                chart_fake: "Фейктер",
                chart_official: "Ресми",
                chart_correct: "Дұрыс",
                chart_errors: "Қателер",
                correct_msg: "✅ Дұрыс! +50 XP",
                wrong_msg: "❌ Қате! Қайта байқап көр."
            },
            ru: {
                rating: "РЕЙТИНГ:",
                shop: "🛒 МАГАЗИН",
                ai_case_title: "AI СИМУЛЯТОР КЕЙСОВ",
                threats_title: "КАРТА КИБЕРУГРОЗ РК",
                accuracy_title: "ВАША ТОЧНОСТЬ АНАЛИЗА",
                cyberpol_title: "КИБЕРПОЛ РК & EGOV",
                cyberpol_desc: "Подозрительный сайт или сообщение? Проверьте ресурсы через официальные базы данных:",
                btn_cert: "KZ-CERT Служба компьютерной безопасности",
                btn_egov: "eGov.kz Официальный портал",
                chart_phishing: "Фишинг",
                chart_deepfake: "Дипфейки",
                chart_fake: "Фейки",
                chart_official: "Официально",
                chart_correct: "Верно",
                chart_errors: "Ошибки",
                correct_msg: "✅ Верно! +50 XP",
                wrong_msg: "❌ Ошибка! Попробуйте еще раз."
            },
            en: {
                rating: "RATING:",
                shop: "🛒 SHOP",
                ai_case_title: "AI SIMULATOR CASES",
                threats_title: "KZ CYBER THREAT MAP",
                accuracy_title: "YOUR ACCURACY RATE",
                cyberpol_title: "CYBERPOL KZ & EGOV",
                cyberpol_desc: "Suspicious website or message? Verify resources through official databases:",
                btn_cert: "KZ-CERT Computer Security Service",
                btn_egov: "eGov.kz Official Portal",
                chart_phishing: "Phishing",
                chart_deepfake: "Deepfakes",
                chart_fake: "Fakes",
                chart_official: "Official",
                chart_correct: "Correct",
                chart_errors: "Errors",
                correct_msg: "✅ Correct! +50 XP",
                wrong_msg: "❌ Incorrect! Try again."
            }
        };

        const aiCases = [
            {
                type: 'phishing',
                text: {
                    kz: "SMS: 'Kaspi-дегі шотыңыз бұғатталды. Бұғаттан шығару үшін мына сілтемеге өтіңіз: kaspi-security.cc'",
                    ru: "SMS: 'Ваш счет Kaspi заблокирован. Для разблокировки перейдите по ссылке: kaspi-security.cc'",
                    en: "SMS: 'Your Kaspi account is blocked. Restore access at: kaspi-security.cc'"
                }
            },
            {
                type: 'deepfake',
                text: {
                    kz: "Президенттің барлық азаматтарға 500,000 ₸ төлем беру туралы видеоүндеуі тарады (ерін қозғалысы сәйкес келмейді).",
                    ru: "Видеообращение Президента о выплате 500,000 ₸ каждому гражданину (мимика и звук не совпадают).",
                    en: "Video of the President promising $1,000 payout to all citizens (unnatural lip movements)."
                }
            },
            {
                type: 'official',
                text: {
                    kz: "1414 қызметінен SMS: 'Сіздің ЭЦҚ мерзімі 3 күннен кейін аяқталады. egov.kz сайтында жаңартыңыз.'",
                    ru: "SMS от 1414: 'Срок действия вашего ЭЦП истекает через 3 дня. Обновите на egov.kz.'",
                    en: "SMS from 1414: 'Your Digital Signature expires in 3 days. Renew at egov.kz.'"
                }
            },
            {
                type: 'fake',
                text: {
                    kz: "Мессенджердегі хабарлама: 'Энергетиктерде қауіпті химиялық зат бар, ешкім сатып алмасын!'",
                    ru: "Сообщение в мессенджерах: 'В энергетических напитках найден опасный яд, срочно перешлите всем!'",
                    en: "Forwarded message: 'Energy drinks contain toxic chemicals, do not drink! Pass it on!'"
                }
            }
        ];

        let currentLang = 'ru';
        let threatsChart, accuracyChart;
        let currentCase = null;
        let userXP = 3950;
        let correctCount = 37;
        let errorCount = 22;

        function generateCase() {
            const randomIndex = Math.floor(Math.random() * aiCases.length);
            currentCase = aiCases[randomIndex];
            document.getElementById('caseText').textContent = currentCase.text[currentLang];
            document.getElementById('feedbackText').textContent = '';
        }

        function checkAnswer(selectedType) {
            if (!currentCase) return;

            const feedback = document.getElementById('feedbackText');
            if (selectedType === currentCase.type) {
                feedback.style.color = '#6bc97f';
                feedback.textContent = translations[currentLang].correct_msg;
                userXP += 50;
                correctCount++;
                document.getElementById('xpDisplay').textContent = userXP + ' XP';
                updateAccuracyChart();
                setTimeout(generateCase, 1200);
            } else {
                feedback.style.color = '#ff6b6b';
                feedback.textContent = translations[currentLang].wrong_msg;
                errorCount++;
                updateAccuracyChart();
            }
        }

        function updateAccuracyChart() {
            if (accuracyChart) {
                accuracyChart.data.datasets[0].data = [correctCount, errorCount];
                accuracyChart.update();
            }
        }

        function initCharts() {
            const ctx1 = document.getElementById('threatsChart').getContext('2d');
            threatsChart = new Chart(ctx1, {
                type: 'doughnut',
                data: {
                    labels: [
                        translations[currentLang].chart_phishing,
                        translations[currentLang].chart_deepfake,
                        translations[currentLang].chart_fake,
                        translations[currentLang].chart_official
                    ],
                    datasets: [{
                        data: [50, 20, 15, 15],
                        backgroundColor: ['#ff6b6b', '#4d82f3', '#ffde59', '#6bc97f'],
                        borderWidth: 2,
                        borderColor: '#000'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom' } }
                }
            });

            const ctx2 = document.getElementById('accuracyChart').getContext('2d');
            accuracyChart = new Chart(ctx2, {
                type: 'bar',
                data: {
                    labels: [
                        translations[currentLang].chart_correct,
                        translations[currentLang].chart_errors
                    ],
                    datasets: [{
                        data: [correctCount, errorCount],
                        backgroundColor: ['#6bc97f', '#ff6b6b'],
                        borderWidth: 2,
                        borderColor: '#000'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: true } }
                }
            });
        }

        function setLanguage(lang, btnElement) {
            currentLang = lang;

            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            if (btnElement) {
                btnElement.classList.add('active');
            }

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) {
                    el.textContent = translations[lang][key];
                }
            });

            if (currentCase) {
                document.getElementById('caseText').textContent = currentCase.text[lang];
            }

            if (threatsChart && accuracyChart) {
                threatsChart.data.labels = [
                    translations[lang].chart_phishing,
                    translations[lang].chart_deepfake,
                    translations[lang].chart_fake,
                    translations[lang].chart_official
                ];
                threatsChart.update();

                accuracyChart.data.labels = [
                    translations[lang].chart_correct,
                    translations[lang].chart_errors
                ];
                accuracyChart.update();
            }
        }

        window.onload = () => {
            initCharts();
            generateCase();
            setLanguage('ru', document.querySelectorAll('.lang-btn')[1]);
        };
    </script>
</body>
</html>
