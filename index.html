<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberSaq Dashboard</title>
    <!-- Chart.js для графиков -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #f5f5f0;
            --card-bg: #ffffff;
            --dark-card: #1e1e1e;
            --border-color: #000000;
            --primary-yellow: #ffde59;
            --accent-green: #6bc97f;
            --accent-red: #ff6b6b;
            --accent-blue: #4d82f3;
        }

        body {
            font-family: 'Courier New', Courier, monospace, sans-serif;
            background-color: var(--bg-color);
            margin: 20px;
            color: #000;
        }

        /* Верхняя панель управления */
        .top-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            align-items: center;
        }

        .lang-switch {
            background-color: #fff;
            border: 3px solid var(--border-color);
            box-shadow: 3px 3px 0 var(--border-color);
            display: flex;
            padding: 2px;
        }

        .lang-btn {
            border: none;
            background: transparent;
            padding: 6px 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }

        .lang-btn.active {
            background-color: var(--primary-yellow);
            border: 2px solid var(--border-color);
        }

        .stat-badge {
            background-color: #fff;
            border: 3px solid var(--border-color);
            box-shadow: 3px 3px 0 var(--border-color);
            padding: 8px 16px;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stat-badge span.highlight {
            color: var(--accent-red);
        }

        .shop-btn {
            background-color: #fff;
            border: 3px solid var(--border-color);
            box-shadow: 3px 3px 0 var(--border-color);
            padding: 8px 16px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }

        /* Контейнер виджетов */
        .dashboard-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 450px;
        }

        .card {
            background: var(--card-bg);
            border: 3px solid var(--border-color);
            box-shadow: 4px 4px 0 var(--border-color);
            padding: 15px;
            position: relative;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .external-link {
            background: var(--primary-yellow);
            border: 2px solid var(--border-color);
            padding: 2px 8px;
            font-size: 11px;
            text-decoration: none;
            color: #000;
            font-weight: bold;
        }

        /* Темная карточка Cyberpol */
        .card.dark {
            background-color: var(--dark-card);
            color: #fff;
        }

        .card.dark .card-title {
            color: var(--primary-yellow);
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card.dark p {
            font-size: 12px;
            color: #ccc;
            line-height: 1.4;
            margin-bottom: 15px;
        }

        .cyber-btn {
            display: block;
            width: 100%;
            background: transparent;
            border: 1px solid #555;
            color: #fff;
            padding: 10px;
            text-align: center;
            text-decoration: none;
            font-size: 12px;
            margin-bottom: 8px;
            box-sizing: border-box;
            transition: 0.2s;
        }

        .cyber-btn:hover {
            border-color: var(--primary-yellow);
            color: var(--primary-yellow);
        }

        /* Графики */
        .chart-container {
            position: relative;
            width: 100%;
            height: 200px;
        }
    </style>
</head>
<body>

    <!-- Верхнее меню -->
    <div class="top-bar">
        <div class="lang-switch">
            <button class="lang-btn" onclick="setLanguage('kz')">KZ</button>
            <button class="lang-btn active" onclick="setLanguage('ru')">RU</button>
            <button class="lang-btn" onclick="setLanguage('en')">EN</button>
        </div>
        <div class="stat-badge">
            <span data-i18n="rating">РЕЙТИНГ:</span> 
            <span class="highlight">3950 XP</span>
        </div>
        <button class="shop-btn" data-i18n="shop">🛒 МАГАЗИН</button>
    </div>

    <div class="dashboard-grid">
        
        <!-- Карточка 1: Карта киберугроз -->
        <div class="card">
            <div class="card-header">
                <span>📊 <span data-i18n="threats_title">КАРТА КИБЕРУГРОЗ РК</span></span>
                <a href="#" class="external-link">KZ-CERT ↗</a>
            </div>
            <div class="chart-container">
                <canvas id="threatsChart"></canvas>
            </div>
        </div>

        <!-- Карточка 2: Точность анализа -->
        <div class="card">
            <div class="card-header">
                <span>🎯 <span data-i18n="accuracy_title">ВАША ТОЧНОСТЬ АНАЛИЗА</span></span>
            </div>
            <div class="chart-container">
                <canvas id="accuracyChart"></canvas>
            </div>
        </div>

        <!-- Карточка 3: Киберпол и EGOV -->
        <div class="card dark">
            <div class="card-title">
                📢 <span data-i18n="cyberpol_title">КИБЕРПОЛ РК & EGOV</span>
            </div>
            <p data-i18n="cyberpol_desc">
                Подозрительный сайт или сообщение? Проверьте ресурсы через официальные базы данных:
            </p>
            <a href="https://cert.gov.kz" target="_blank" class="cyber-btn">
                🛡️ <span data-i18n="btn_cert">Служба компьютерной безопасности KZ-CERT</span>
            </a>
            <a href="https://egov.kz" target="_blank" class="cyber-btn">
                🏛️ <span data-i18n="btn_egov">Официальный портал eGov.kz</span>
            </a>
        </div>

    </div>

    <script>
        // Переводы для 3 языков
        const translations = {
            kz: {
                rating: "РЕЙТИНГ:",
                shop: "🛒 ДҮКЕН",
                threats_title: "ҚР КИБЕРҚАУІПТЕР КАРТАСЫ",
                accuracy_title: "ТАЛДАУ ДӘЛДІГІҢІЗ",
                cyberpol_title: "КИБЕРПОЛ ҚР & EGOV",
                cyberpol_desc: "Күдікті сайт немесе хабарлама ма? Ресурстарды ресми базалар арқылы тексеріңіз:",
                btn_cert: "KZ-CERT Компьютерлік қауіпсіздік қызметі",
                btn_egov: "eGov.kz Ресми порталы",
                chart_phishing: "Фишинг",
                chart_deepfake: "Дипфейктер",
                chart_fake: "Фейктер",
                chart_official: "Ресми",
                chart_correct: "Дұрыс",
                chart_errors: "Қателер"
            },
            ru: {
                rating: "РЕЙТИНГ:",
                shop: "🛒 МАГАЗИН",
                threats_title: "КАРТА КИБЕРУГРОЗ РК",
                accuracy_title: "ВАША ТОЧНОСТЬ АНАЛИЗА",
                cyberpol_title: "КИБЕРПОЛ РК & EGOV",
                cyberpol_desc: "Подозрительный сайт или сообщение? Проверьте ресурсы через официальные базы данных:",
                btn_cert: "KZ-CERT Служба компьютерной безопасности",
                btn_egov: "eGov.kz Официальный портал",
                chart_phishing: "Фишинг",
                chart_deepfake: "Дипфейки",
                chart_fake: "Фейки",
                chart_official: "Официально",
                chart_correct: "Верно",
                chart_errors: "Ошибки"
            },
            en: {
                rating: "RATING:",
                shop: "🛒 SHOP",
                threats_title: "KZ CYBER THREAT MAP",
                accuracy_title: "YOUR ANALYSIS ACCURACY",
                cyberpol_title: "CYBERPOL KZ & EGOV",
                cyberpol_desc: "Suspicious website or message? Verify resources through official databases:",
                btn_cert: "KZ-CERT Computer Security Service",
                btn_egov: "eGov.kz Official Portal",
                chart_phishing: "Phishing",
                chart_deepfake: "Deepfakes",
                chart_fake: "Fakes",
                chart_official: "Official",
                chart_correct: "Correct",
                chart_errors: "Errors"
            }
        };

        let currentLang = 'ru';
        let threatsChart, accuracyChart;

        // Инициализация графиков Chart.js
        function initCharts() {
            const ctx1 = document.getElementById('threatsChart').getContext('2d');
            threatsChart = new Chart(ctx1, {
                type: 'doughnut',
                data: {
                    labels: [
                        translations[currentLang].chart_phishing,
                        translations[currentLang].chart_deepfake,
                        translations[currentLang].chart_fake,
                        translations[currentLang].chart_official
                    ],
                    datasets: [{
                        data: [50, 20, 15, 15],
                        backgroundColor: ['#ff6b6b', '#4d82f3', '#ffde59', '#6bc97f'],
                        borderWidth: 2,
                        borderColor: '#000'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom' }
                    }
                }
            });

            const ctx2 = document.getElementById('accuracyChart').getContext('2d');
            accuracyChart = new Chart(ctx2, {
                type: 'bar',
                data: {
                    labels: [
                        translations[currentLang].chart_correct,
                        translations[currentLang].chart_errors
                    ],
                    datasets: [{
                        data: [38, 22],
                        backgroundColor: ['#6bc97f', '#ff6b6b'],
                        borderWidth: 2,
                        borderColor: '#000'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: { beginAtZero: true, max: 40 }
                    }
                }
            });
        }

        // Функция смены языка
        function setLanguage(lang) {
            currentLang = lang;

            // Обновляем активную кнопку
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.textContent.toLowerCase() === lang) {
                    btn.classList.add('active');
                }
            });

            // Обновляем текстовые элементы
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang][key]) {
                    el.textContent = translations[lang][key];
                }
            });

            // Обновляем метки в графиках
            if (threatsChart && accuracyChart) {
                threatsChart.data.labels = [
                    translations[lang].chart_phishing,
                    translations[lang].chart_deepfake,
                    translations[lang].chart_fake,
                    translations[lang].chart_official
                ];
                threatsChart.update();

                accuracyChart.data.labels = [
                    translations[lang].chart_correct,
                    translations[lang].chart_errors
                ];
                accuracyChart.update();
            }
        }

        // Запуск при загрузке страницы
        window.onload = () => {
            initCharts();
            setLanguage('ru');
        };
    </script>
</body>
</html>
